[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name='miri3d'
version='2.0.0'
description='MIRI 3d cube tools'
readme="README.md"
dependencies = ['miricoord']

authors = [
    { name = "David R. Law", email = "dlaw@stsci.edu" }
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"miricoord" = ["data/lvl2btemplate/*"]
